app = "faroese-radio-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.web"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Node would otherwise allow itself a ~260 MB heap on a 512 MB machine. With
  # Next's in-memory caches (up to ~100 MB) on top, that's more than the machine
  # has, and it stalls collecting garbage instead of crashing. A smaller heap
  # makes Node collect garbage before the machine runs out.
  NODE_OPTIONS = "--max-old-space-size=192"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep both machines running. A shared-cpu-1x machine only gets a small slice
  # of a CPU, and one machine alone gets throttled under normal traffic. Fly
  # also doesn't check health when it picks which machine to stop, so with one
  # it could stop the healthy machine and leave a struggling one running.
  min_machines_running = 2

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
