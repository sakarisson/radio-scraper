name: Deploy Web to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - packages/web-ui/**
      - Dockerfile.web
      - fly.web.toml
      # Migrations can change past data (e.g. flagging plays as non-music).
      # The web app's data cache lives in memory, so a redeploy clears it.
      - supabase/migrations/**
      - .github/workflows/deploy-web.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Supabase credentials are Fly secrets, read at runtime
      - run: flyctl deploy -c fly.web.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
